# Wijhan — reference Nginx config (https://www.wijhan.com)
#
# Canonical form: https + www + no trailing slash. Every violation gets ONE 301 straight to the
# final URL (never http -> https -> www -> no-slash chains). The app (src/server.ts) enforces the
# same rules as a backstop, so this file is the fast path, not the only line of defence.
#
# Layout assumed: the Node server from `npm run build` (NITRO_PRESET=node-server) listens on
# 127.0.0.1:3000 and serves everything, including /assets. Serving .output/public directly
# from Nginx (the `location /assets/` block below) is an optional optimisation.
# Requires ngx_brotli (https://github.com/google/ngx_brotli) for `brotli on`; remove those
# lines if the module is unavailable — gzip alone is fine.

# ---- http://wijhan.com, http://www.wijhan.com -> https://www.wijhan.com (one hop) -------------
server {
    listen 80;
    listen [::]:80;
    server_name wijhan.com www.wijhan.com;

    # Let's Encrypt HTTP-01 challenges must stay reachable over plain http.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        # Strip a trailing slash in the same redirect (keeps it to one hop; query string is
        # appended automatically by `rewrite ... permanent`).
        rewrite ^/(.+?)/+$ https://www.wijhan.com/$1 permanent;
        return 301 https://www.wijhan.com$request_uri;
    }
}

# ---- https://wijhan.com -> https://www.wijhan.com ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wijhan.com;

    ssl_certificate     /etc/letsencrypt/live/wijhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wijhan.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    rewrite ^/(.+?)/+$ https://www.wijhan.com/$1 permanent;
    return 301 https://www.wijhan.com$request_uri;
}

# ---- https://www.wijhan.com (the real site) -----------------------------------------------
upstream wijhan_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.wijhan.com;

    ssl_certificate     /etc/letsencrypt/live/wijhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wijhan.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- compression (HTML, JS, CSS, JSON, SVG, XML; never already-compressed images/fonts) ---
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml;
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml application/manifest+json image/svg+xml;

    # --- security headers (the app also sets these on HTML; `always` covers 3xx/4xx/5xx) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- one canonical URL: no trailing slash (the app does this too) -----------------------
    rewrite ^/(.+?)/+$ /$1 permanent;

    # --- removed pages -> closest live page (also handled in src/lib/canonical-redirect.ts) ---
    location = /pricing    { return 301 https://www.wijhan.com/contact; }
    location = /ar/pricing { return 301 https://www.wijhan.com/ar/contact; }

    # --- hashed build output: cache forever. Optional: serve straight from disk. -----------
    location /assets/ {
        root /srv/wijhan/.output/public;           # remove this block to let the app serve it
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;                        # a missing hashed file must 404, never fall back to HTML
    }

    # --- un-hashed static files: revalidate daily -------------------------------------------
    location ~* ^/(og/|data/|images/|case-studies/|favicon\.png$|apple-touch-icon\.png$|icon-(192|512)\.png$|site\.webmanifest$) {
        proxy_pass http://wijhan_app;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # --- everything else: SSR HTML, sitemap.xml, robots.txt ---------------------------------
    # The app sets Cache-Control itself: HTML `max-age=0, s-maxage=300, stale-while-revalidate=600`,
    # 5xx `no-store`, sitemap `s-maxage=3600`. Do not override it here.
    location / {
        proxy_pass http://wijhan_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;        # SSR gives the API at most 5s; a hung upstream must not hold workers
        proxy_buffering on;            # lets Nginx compress streamed SSR responses
    }

    # --- never index private paths even if something is deployed there ---------------------
    location ^~ /admin { add_header X-Robots-Tag "noindex, nofollow" always; proxy_pass http://wijhan_app; }
}
